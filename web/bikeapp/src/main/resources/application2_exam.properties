#settings
spring.datasource.driverClassName=net.sf.log4jdbc.sql.jdbcapi.DriverSpy
spring.datasource.url=${DB_URL:jdbc:log4jdbc:mariadb://}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}


spring.thymeleaf.prefix=classpath:templates/
spring.thymeleaf.check-template-location=true
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML5
spring.thymeleaf.cache=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

logging.level.root=info

trailgo.admin.username=${TRAILGO_ADMIN_USERNAME:}
# BCrypt hash ($2a$...) of the admin password. TEMPORARY default = admin1234 for development only:
# remove this default (keep the environment variable) before the real service launch.
trailgo.admin.password-hash=${TRAILGO_ADMIN_PASSWORD_HASH:}
trailgo.maps.kakao-app-key=
trailgo.android-download-url=${TRAILGO_ANDROID_DOWNLOAD_URL:https://play.google.com/store/apps/details?id=com.bike.trailgo}
trailgo.support-email=

spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.jpa.show-sql=false
server.port = 8002
trailgo.storage-root=${TRAILGO_STORAGE_ROOT:${user.dir}/data}

# Weather snapshot for rides. The KMA key is injected from the server environment only: never commit it.
trailgo.weather.kma-service-key=${KMA_SERVICE_KEY:}

# Riding photos: largest accepted upload in bytes (the app sends ~1 MB compressed JPEGs).
trailgo.photo.max-bytes=${TRAILGO_PHOTO_MAX_BYTES:8388608}

# Kakao app id (numeric, Kakao Developers > App > Summary). Access tokens issued for another Kakao app are refused;
# without it Kakao sign-in is switched off.
trailgo.auth.kakao-app-id=${KAKAO_APP_ID:}
